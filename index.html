<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LiaScript</title>

    <meta
      name="description"
      content="Interactive LiaScript courses (quizzes, surveys, code, animations) from a course URL or Markdown, optionally synced within a room. For more information see <br><a href='https://github.com/edrys-labs/module-liascript' target='_blank'>https://github.com/edrys-labs/module-liascript</a>"
    />
    <meta name="show-in" content="*" />
    <meta
      name="module-config"
      content="{
        'config': {
          'course': {
            'type': 'text',
            'hint': 'URL of a LiaScript course, i.e. its raw Markdown (e.g. https://raw.githubusercontent.com/.../README.md); used instead of content',
          },
          'content': {
            'type': 'code-area',
            'hint': 'LiaScript Markdown of the course, used when course is empty',
          },
          'classroom': {
            'type': 'boolean',
            'hint': 'Classroom mode: share quiz and survey results and a chat between the users of a room (the Lobby too); each user joins with connect in the LiaScript classroom dialog',
          },
          'player': {
            'type': 'text',
            'hint': 'LiaScript player to use, e.g. a pinned or self-hosted build (default https://liascript.github.io/course/)',
          }
        }
      }"
    />

    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/water.min.css" />
    <!-- colours and fonts of the messages in the classroom's light or dark
         theme; the course follows LiaScript's own setting -->
    <link rel="stylesheet" href="https://edrys-labs.github.io/module/edrys-module.css" />
    <style>
      /* the player fills the module; water.css would centre and pad the body */
      html,
      body {
        height: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* block, so no line box adds a few pixels and a scrollbar below it */
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* the display rule above would otherwise override the hidden attribute */
      [hidden] {
        display: none !important;
      }

      .message {
        margin: 0;
        padding: 16px 18px;
        color: var(--edrys-muted);
      }

      /* replaced by the course or a message; appears only after 0.5s, so fast loads don't flicker */
      .loading {
        opacity: 0;
        animation: show-loading 0s 0.5s forwards;
      }

      @keyframes show-loading {
        to {
          opacity: 1;
        }
      }
    </style>

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>
  </head>

  <body>
    <p id="message" class="message loading">Loading LiaScript…</p>
    <iframe
      id="player"
      title="LiaScript course"
      allow="camera; microphone; fullscreen; display-capture;"
      hidden
    ></iframe>

    <script>
      const DEFAULT_PLAYER = 'https://liascript.github.io/course/'

      // the player's server rejects longer request URLs (GitHub Pages: 414 above ~8 KB)
      const MAX_QUERY = 7000

      // configs that could not be parsed stay strings, missing ones are null or ''
      const asObject = (config) => (config && typeof config === 'object' ? config : {})

      const bytesToBase64 = (bytes) => btoa(Array.from(bytes, (byte) => String.fromCharCode(byte)).join(''))

      // btoa() only takes Latin-1, LiaScript decodes the base64 as UTF-8
      const toBase64 = (text) => bytesToBase64(new TextEncoder().encode(text))

      async function gzipBase64(text) {
        const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))
        return bytesToBase64(new Uint8Array(await new Response(stream).arrayBuffer()))
      }

      /** A short ID of the content (cyrb53), so LiaScript keeps state per course text. */
      function contentId(text) {
        let h1 = 0xdeadbeef
        let h2 = 0x41c6ce57
        for (let i = 0; i < text.length; i++) {
          const c = text.charCodeAt(i)
          h1 = Math.imul(h1 ^ c, 2654435761)
          h2 = Math.imul(h2 ^ c, 1597334677)
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909)
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909)
        return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16)
      }

      /** The player's query for a course address, wrapped for classroom mode. */
      function wrap(course, classroom) {
        if (!classroom) return course

        return toBase64(
          JSON.stringify({
            backend: 'edrys',
            course,
            room: `${Edrys.class_id}/${Edrys.liveUser.room}`,
            // LiaScript requires the classroom mode: 0 Shared, 1 Summary, 2 Details
            mode: 0,
          })
        )
      }

      /**
       * The player's query. Inline content goes into the URL while it fits, gzipped if needed;
       * larger content is asked for by LiaScript (`parent:<id>`, see supplyContent).
       */
      async function courseQuery(config, classroom) {
        if (config.course) return { query: wrap(config.course, classroom) }

        const plain = wrap(`data:text/plain;base64,${toBase64(config.content)}`, classroom)
        if (plain.length <= MAX_QUERY) return { query: plain }

        const gzip = wrap(`data:text/plain;gzip;base64,${await gzipBase64(config.content)}`, classroom)
        if (gzip.length <= MAX_QUERY) return { query: gzip }

        const uri = `parent:${contentId(config.content)}`
        return { query: wrap(uri, classroom), uri }
      }

      /** Answer LiaScript's request for a `parent:` course with the configured content. */
      function supplyContent(player, origin, uri, content) {
        window.addEventListener('message', (e) => {
          if (e.source !== player.contentWindow || e.origin !== origin) return

          const { cmd, param } = e.data || {}
          if (cmd === 'lia-course' && param?.uri === uri) {
            player.contentWindow.postMessage({ cmd, param: { uri, ok: true, body: content } }, origin)
          }
        })
      }

      /**
       * Classroom mode: LiaScript's Edrys backend sends {subject, body} to this
       * window; the module answers its 'init' and passes everything else on to
       * the other peers of the room, and their messages back into the player.
       */
      function relay(player, origin) {
        Edrys.onMessage(({ from, subject, body }) => {
          if (from !== Edrys.username) {
            player.contentWindow.postMessage({ subject, body }, origin)
          }
        })

        window.addEventListener('message', (e) => {
          // edrys-Lite's own events arrive here as well
          if (e.source !== player.contentWindow || e.origin !== origin) return

          const { subject, body } = e.data || {}
          // e.g. LiaScript's own {cmd: 'lia-ready'}
          if (typeof subject !== 'string') return

          if (subject === 'init') {
            player.contentWindow.postMessage({ subject, body: true }, origin)
          } else {
            Edrys.sendMessage(subject, body)
          }
        })
      }

      function showMessage(text) {
        const message = document.getElementById('message')
        message.classList.remove('loading')
        message.textContent = text
      }

      Edrys.onReady(async () => {
        const config = asObject(Edrys.module.config)
        const player = document.getElementById('player')

        if (!config.course && !config.content) {
          showMessage(
            'No course yet: set course (the URL of a LiaScript course) or content (LiaScript Markdown) in the module settings.'
          )
          return
        }

        let origin
        try {
          origin = new URL(config.player || DEFAULT_PLAYER).origin
        } catch (e) {
          showMessage(`The player setting is not a URL: ${config.player}. Fix or clear it in the module settings.`)
          return
        }

        const classroom = config.classroom === true
        const { query, uri } = await courseQuery(config, classroom)

        if (uri) supplyContent(player, origin, uri, config.content)
        if (classroom) relay(player, origin)

        player.addEventListener(
          'load',
          () => {
            document.getElementById('message').hidden = true
            player.hidden = false
          },
          { once: true }
        )
        player.src = `${config.player || DEFAULT_PLAYER}?${query}`
      })
    </script>
  </body>
</html>
