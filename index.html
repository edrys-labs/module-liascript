<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A LiaScript module, don't forget to specify course"
    />
    <meta name="show-in" content="*" />
    <meta 
      name="module-config" 
      content="{
        'config': {
          'classroom': {
            'type': boolean,
            'hint': 'Disable or enable classroom synchronization'
          },
          'course': {
            'type': string,
            'hint': 'Raw LiaScript URL of the course'
          },
          'content': {
            'type': text-area,
            'hint': 'Define the course content manually'
          },
        },
      }" 
    />

    <title>LiaScript</title>

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>

    <style>
      body,
      html,
      iframe {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        overflow: hidden;
      }

      iframe {
        border: 0;
      }
    </style>
  </head>

  <body>
    <iframe
      id="player"
      title="LiaScript course"
      allow="camera; microphone; fullscreen; display-capture;"
    ></iframe>

    <script>
      const LIASCRIPT = 'https://liascript.github.io/course/'
      const LIASCRIPT_ORIGIN = new URL(LIASCRIPT).origin

      const EMPTY_COURSE =
        '# Warning no content defined\n\nSee the documentation for more information.\n\nhttps://github.com/edrys-labs/module-liascript'

      // btoa() only takes Latin-1, LiaScript decodes the base64 as UTF-8
      function toBase64(text) {
        return btoa(
          Array.from(new TextEncoder().encode(text), (byte) => String.fromCharCode(byte)).join('')
        )
      }

      /** The player's query (a course URL, or inline content), wrapped for classroom mode. */
      function courseQuery(config) {
        let classroom = config.classroom === true && Edrys.liveUser.room !== 'Lobby'
        let course = config.course

        if (!course) {
          if (!config.content) classroom = false
          course = `data:text/plain;base64,${toBase64(config.content || EMPTY_COURSE)}`
        }

        if (!classroom) return { query: course, classroom }

        const query = toBase64(
          JSON.stringify({
            backend: 'edrys',
            course,
            room: `${Edrys.class_id}/${Edrys.liveUser.room}`,
            // LiaScript requires the classroom mode: 0 Shared, 1 Summary, 2 Details
            mode: 0,
          })
        )
        return { query, classroom }
      }

      /**
       * Classroom mode: LiaScript's Edrys backend sends {subject, body} to this
       * window; the module answers its 'init' and passes everything else on to
       * the other peers of the room, and their messages back into the player.
       */
      function relay(player) {
        Edrys.onMessage(({ from, subject, body }) => {
          if (from !== Edrys.username) {
            player.contentWindow.postMessage({ subject, body }, LIASCRIPT_ORIGIN)
          }
        })

        window.addEventListener('message', (e) => {
          // edrys-Lite's own events arrive here as well
          if (e.source !== player.contentWindow || e.origin !== LIASCRIPT_ORIGIN) return

          const { subject, body } = e.data || {}
          // e.g. LiaScript's own {cmd: 'lia-ready'}
          if (typeof subject !== 'string') return

          if (subject === 'init') {
            player.contentWindow.postMessage({ subject, body: true }, LIASCRIPT_ORIGIN)
          } else {
            Edrys.sendMessage(subject, body)
          }
        })
      }

      Edrys.onReady(() => {
        // missing (imported class) or unparsed config: use the defaults
        const config =
          Edrys.module.config && typeof Edrys.module.config === 'object' ? Edrys.module.config : {}

        const player = document.getElementById('player')
        const { query, classroom } = courseQuery(config)

        if (classroom) relay(player)

        player.src = `${LIASCRIPT}?${query}`
      })
    </script>
  </body>
</html>
